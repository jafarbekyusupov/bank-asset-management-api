# global
spring:
  application:
    name: bank-asset-management
  profiles:
    active: local 
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8081
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

---
# local
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5435/bank_assets
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true

app:
  jwt:
    secret: local-dev-secret-key-160-bits-is-not-secure-enough
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  resend:
    api-key: local-dev
  email:
    from: ${MAIL_FROM:noreply@bank-assets.com}
    base-url: ${APP_BASE_URL:http://localhost:8081}
    verification-token-expiry-hours: 24
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: bank-assets
  qr:
    size: 300
  gemini:
    base-url: ${GEMINI_BASE_URL}
    api-key: ${GEMINI_API_KEY}
    context-window: ${GEMINI_CONTEXT_WINDOW:20}
    max-tool-rounds: ${GEMINI_MAX_TOOL_ROUND:5}

logging:
  level:
    com.bank.assets: DEBUG

---
#prod
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  resend:
    api-key: ${RESEND_API_KEY}
  email:
    from: ${MAIL_FROM}
    base-url: ${APP_BASE_URL}
    verification-token-expiry-hours: 24
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET}
  qr:
    size: 300
  gemini:
    base-url: ${GEMINI_BASE_URL}
    api-key: ${GEMINI_API_KEY}
    context-window: ${GEMINI_CONTEXT_WINDOW}
    max-tool-rounds: ${GEMINI_MAX_TOOL_ROUNDS}

logging:
  level:
    com.bank.assets: INFO